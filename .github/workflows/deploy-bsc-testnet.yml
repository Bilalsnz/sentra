name: deploy-bsc-testnet

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Explicitly confirm deployment to BNB Smart Chain TESTNET (chain 97)"
        required: true
        type: choice
        default: "NO"
        options:
          - "NO"
          - "YES_DEPLOY_TO_BSC_TESTNET"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Sentra contracts to BSC testnet
    if: ${{ inputs.confirm_deployment == 'YES_DEPLOY_TO_BSC_TESTNET' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Validate required secrets and network
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.SENTRA_TESTNET_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$BSC_TESTNET_RPC_URL" || { echo "Missing BSC_TESTNET_RPC_URL repository secret"; exit 1; }
          test -n "$PRIVATE_KEY" || { echo "Missing SENTRA_TESTNET_PRIVATE_KEY repository secret"; exit 1; }
          CHAIN_ID="$(cast chain-id --rpc-url "$BSC_TESTNET_RPC_URL")"
          echo "Connected chain ID: $CHAIN_ID"
          test "$CHAIN_ID" = "97" || { echo "Refusing to deploy: expected BSC testnet chain 97"; exit 1; }

      - name: Build and test contracts
        run: |
          forge fmt --check
          forge build --sizes
          forge test -vvv

      - name: Deploy testnet Mock Agent ID
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.SENTRA_TESTNET_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          DEPLOYER_ADDRESS="$(cast wallet address --private-key "$PRIVATE_KEY")"
          BALANCE="$(cast balance "$DEPLOYER_ADDRESS" --rpc-url "$BSC_TESTNET_RPC_URL")"
          echo "Deployer: $DEPLOYER_ADDRESS"
          echo "Testnet balance (wei): $BALANCE"
          test "$BALANCE" -gt 0 || { echo "Deployer has no tBNB for gas"; exit 1; }
          forge script script/DeployMockAgentID.s.sol:DeployMockAgentID \
            --rpc-url "$BSC_TESTNET_RPC_URL" --private-key "$PRIVATE_KEY" \
            --sender "$DEPLOYER_ADDRESS" --broadcast
          MOCK_AGENT_ID="$(jq -r '.address' deployments/97-mock-agent-id.json)"
          test -n "$MOCK_AGENT_ID" && test "$MOCK_AGENT_ID" != "null"
          MOCK_CODE="$(cast code "$MOCK_AGENT_ID" --rpc-url "$BSC_TESTNET_RPC_URL")"
          test "$MOCK_CODE" != "0x" || { echo "Mock Agent ID has no on-chain bytecode"; exit 1; }
          echo "Verified Mock Agent ID on-chain: $MOCK_AGENT_ID"

      - name: Deploy Sentra Registry using the testnet mock
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.SENTRA_TESTNET_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          MOCK_AGENT_ID="$(jq -r '.address' deployments/97-mock-agent-id.json)"
          test -n "$MOCK_AGENT_ID" && test "$MOCK_AGENT_ID" != "null"
          export AGENT_ID="$MOCK_AGENT_ID"
          DEPLOYER_ADDRESS="$(cast wallet address --private-key "$PRIVATE_KEY")"
          forge script script/DeployRegistry.s.sol:DeployRegistry \
            --rpc-url "$BSC_TESTNET_RPC_URL" --private-key "$PRIVATE_KEY" \
            --sender "$DEPLOYER_ADDRESS" --broadcast

      - name: Deploy Sentra sandbox contracts
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.SENTRA_TESTNET_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          DEPLOYER_ADDRESS="$(cast wallet address --private-key "$PRIVATE_KEY")"
          forge script script/DeploySandboxes.s.sol:DeploySandboxes \
            --rpc-url "$BSC_TESTNET_RPC_URL" --private-key "$PRIVATE_KEY" \
            --sender "$DEPLOYER_ADDRESS" --broadcast

      - name: Publish deployment addresses
        uses: actions/upload-artifact@v4
        with:
          name: sentra-bsc-testnet-deployment
          path: contracts/deployments/*.json
          if-no-files-found: error
          retention-days: 90
